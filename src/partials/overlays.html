<div id="gtip" class="fixed z-[200] hidden pointer-events-none w-max max-w-[380px] rounded-xl p-3 text-[13px] text-ink2 leading-relaxed" style="background:linear-gradient(180deg, rgb(30 38 84 / .97), rgb(13 18 38 / .98));border:1px solid rgb(129 140 248 / .45);box-shadow:0 24px 60px -20px rgb(0 0 0 / .7)"></div>
<div id="tour" class="hidden fixed inset-0 z-[70]">
  <div id="tour-spot"></div>
  <div id="tour-card" class="w-[min(360px,calc(100vw-32px))] rounded-2xl bg-panel border border-line2 shadow-2xl p-5"></div>
</div>

<div id="shortcuts" class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4" onclick="if(event.target===this) toggleShortcuts(false)">
  <div class="w-full max-w-sm rounded-2xl bg-panel border border-line2 p-5 text-xs shadow-2xl">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-bold text-ink">Keyboard shortcuts</h3>
      <button onclick="toggleShortcuts(false)" class="p-1 rounded hover:bg-hov text-ink3"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="grid grid-cols-[auto,1fr] gap-x-4 gap-y-2 text-ink2" id="shortcut-list"></div>
  </div>
</div>

<div id="toast" class="fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-50 translate-y-10 opacity-0 transition-all duration-200 pointer-events-none bg-panel border border-line2 text-ink px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2">
  <span id="toast-icon"></span><span id="toast-msg">Done</span>
</div>
